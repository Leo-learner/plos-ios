name: PLOS
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  PLOSKernel:
    path: .
targets:
  PLOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PLOS
    dependencies:
      - package: PLOSKernel
        product: PLOSKernel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plos.app
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
